server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 100MB
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the .NET Backend
    location /api/ {
        # Use Docker's internal DNS to resolve the backend dynamically
        resolver 127.0.0.11 valid=30s;
        set $upstream http://backend:5123;
        
        # We don't use /api/ in the proxy_pass to avoid appending it twice if not intended,
        # but since original was $upstream/api/, we must be careful with trailing slashes.
        # Original: proxy_pass http://backend:5123/api/;
        proxy_pass $upstream/api/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Long timeout for SOM training and Preprocessing
        proxy_read_timeout 3600;
        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
    }
}
