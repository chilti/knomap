name: Build and Release Installers

on:
  workflow_dispatch:  # Permite ejecutarlo manualmente
  push:
    tags:
      - 'v*'          # Se ejecuta solo al crear un tag (ej: v1.0.0)

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Backend (Windows)
        working-directory: ./backend/src/LabSOM.Backend.Core
        run: dotnet publish -c Release -r win-x64 --self-contained true -o ../../../publish

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer-lite.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knoMap_Windows
          path: Output/knoMap_Installer_Lite.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Backend (Linux)
        working-directory: ./backend/src/LabSOM.Backend.Core
        run: dotnet publish -c Release -r linux-x64 --self-contained true -o ../../../publish_linux

      - name: Package Linux ZIP
        run: |
          mkdir -p Output
          cd publish_linux && zip -r ../Output/knoMap_Linux.zip .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knoMap_Linux
          path: Output/knoMap_Linux.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Build Backend (macOS)
        working-directory: ./backend/src/LabSOM.Backend.Core
        run: dotnet publish -c Release -r osx-x64 --self-contained true -o ../../../publish_mac

      - name: Create macOS Bundle & Zip
        run: |
          mkdir -p Output
          cd publish_mac && zip -r ../Output/knoMap_Mac_Silicon.zip .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: knoMap_Mac
          path: Output/knoMap_Mac_Silicon.zip

  release:
    needs: [build-windows, build-linux, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/knoMap_Windows/knoMap_Installer_Lite.exe
            artifacts/knoMap_Linux/knoMap_Linux.zip
            artifacts/knoMap_Mac/knoMap_Mac_Silicon.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
