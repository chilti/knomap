version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
    ports:
      - "5015:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    environment:
      - ADMIN_PASSWORD=admin123
      - JWT_SECRET=knomap_super_secret_jwt_key_2026_change_in_production_environment_998877665544332211
      - DOTNET_RUNNING_IN_CONTAINER=true
    volumes:
      - knomap_data:/app/backend/App_Data
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

volumes:
  knomap_data:
